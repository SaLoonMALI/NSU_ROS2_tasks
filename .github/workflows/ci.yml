name: NSU_ROBO_ros2_pr1_checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dload__course-kit
        shell: sh
        run: |
          mkdir -p /home
          cd /home
          curl -fsSLo course-kit.tar.gz "https://ros.lms.ci.nsu.ru//downloads/robotics-course-kit-v1-w06-6eda53e1c566.tar.gz"
          mkdir -p /home/.course-kit
          tar -xzf robotics-course-kit-v1-w06-6eda53e1c566.tar.gz -C /home/.course-kit        
          python3 /home/.course_kit/v1/tools/check_practice.py PR02 --submission -
